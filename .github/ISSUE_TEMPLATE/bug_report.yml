name: Bug report
description: Report a reproducible server bug. Do not include game assets, data, or secrets.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste game data, client files, account data, tokens,
        passwords, IP addresses, or logs containing personal information.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, with placeholder names instead of real accounts.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: The commit hash or release tag you are running.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Windows / Linux / macOS and version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Remove tokens, account names, IPs, and game data first.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have removed credentials, personal data, and game assets from this report.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true
